name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel setuptools
    
    - name: Build distribution
      run: python -m build
    
    - name: Check distribution
      run: twine check dist/*
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: dist/
    
    - name: Extract version from tag
      id: tag_name
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Generate changelog
      id: changelog
      run: |
        git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s" > CHANGELOG_TEMP.txt || echo "- Initial release" > CHANGELOG_TEMP.txt
        cat CHANGELOG_TEMP.txt
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref }}
        name: Release ${{ steps.tag_name.outputs.version }}
        body_path: CHANGELOG_TEMP.txt
        files: dist/*
        draft: false
        prerelease: ${{ contains(steps.tag_name.outputs.version, 'alpha') || contains(steps.tag_name.outputs.version, 'beta') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Publish to PyPI
      if: startsWith(github.ref, 'refs/tags/v') && !contains(steps.tag_name.outputs.version, 'alpha') && !contains(steps.tag_name.outputs.version, 'beta')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/* --skip-existing
    
    - name: Publish to Test PyPI
      if: startsWith(github.ref, 'refs/tags/v') && (contains(steps.tag_name.outputs.version, 'alpha') || contains(steps.tag_name.outputs.version, 'beta'))
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        twine upload dist/* -r testpypi --skip-existing || true

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    
    steps:
    - name: Release complete notification
      run: echo "Release ${{ github.ref }} completed successfully!"
